name: Deploy para o Somee.com

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  DOTNET_VERSION: "8.0.x"

jobs:
  build-e-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar dependências (win-x86)
        run: dotnet restore GestaoFinanceiraMEI.csproj -r win-x86

      - name: Publicar artefatos (win-x86, framework-dependente)
        run: dotnet publish GestaoFinanceiraMEI.csproj -c Release -r win-x86 --self-contained false --no-restore -o "${{ github.workspace }}/publicado"

      - name: Injetar connection string real do Somee
        run: |
          sed -i "s|__SOMEE_CONNECTION_STRING__|${{ secrets.SOMEE_DB_CONNECTION_STRING }}|g" "${{ github.workspace }}/publicado/appsettings.Production.json"

      - name: Deploy via FTP para o Somee
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SOMEE_FTP_HOST }}
          username: ${{ secrets.SOMEE_FTP_USER }}
          password: ${{ secrets.SOMEE_FTP_PASSWORD }}
          local-dir: ./publicado/
          server-dir: ./
          protocol: ftp
